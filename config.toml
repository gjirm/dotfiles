# ==============================================================================
# MISE MASTER CONFIGURATION
# Shared across both machines (personal/linu and work/macos).
# Role layers (mise.personal.toml / mise.work.toml) both activate explicitly
# via bootstrap.sh. Each role file contains everything for that machine.
# ==============================================================================
[settings]
auto_update = true

[vars]
name = "Jiri Matejicek"

# ==============================================================================
# SECRETS (mise bootstrap secrets status)
# Resolved before any other bootstrap phase.
# ==============================================================================
##[bootstrap.secrets]
#github_ssh_key = "GITHUB_SSH_KEY"

# ==============================================================================
# SYSTEM DIRECTORIES AND FILES (mise bootstrap files apply)
# ==============================================================================

# [bootstrap.files."~/.ssh/id_ed25519"]
# content = "{{ secret(name=\"github_ssh_key\") }}"
# template = true
# mode = "0600"

# ==============================================================================
# DOTFILES & TEMPLATES (mise bootstrap dotfiles apply)
# ==============================================================================
[dotfiles."zsh/zshrc.tera"]
source = "dotfiles/.config/zsh/zshrc.tera"
mode = "template"
variants = [
    { os = "linux", target = "~/.zshrc" },
]

[dotfiles.gitconfig]
source = "dotfiles/.config/git/gitconfig.tera"
mode = "template"
variants = [
    { os = "linux", target = "~/.gitconfig" },
    { os = "windows", target = "~/.gitconfig" },
]

[dotfiles."atuin/config.toml"]
source = "dotfiles/.config/atuin/config.toml"
mode = "copy"
variants = [
    { os = "linux", target = "~/.config/atuin/config.toml" },
]

[dotfiles.bat]
source = "dotfiles/.config/bat"
mode = "copy"
variants = [
    { os = "linux", target = "~/.config/bat" },
]

[dotfiles."tmux/tmux.conf"]
source = "dotfiles/.config/tmux/tmux.conf"
mode = "copy"
variants = [
    { os = "linux", target = "~/.config/tmux/tmux.conf" },
]

[dotfiles."vim/.vimrc"]
source = "dotfiles/.config/vim/.vimrc"
mode = "copy"
variants = [
    { os = "linux", target = "~/.vimrc" },
]

[dotfiles.starship]
source = "dotfiles/.config/starship"
mode = "copy"
variants = [
    { os = "linux", target = "~/.config/starship" },
    { os = "windows", target = "~/.config/starship" },
]

[dotfiles."micro/settings.json"]
source = "dotfiles/.config/micro/settings.json"
mode = "copy"
variants = [
    { os = "linux", target = "~/.config/micro/settings.json" },
    { os = "windows", target = "~/.config/micro/settings.json" },
]

[dotfiles."powershell/Microsoft.PowerShell_profile.ps1"]
source = "dotfiles/.config/powershell/Microsoft.PowerShell_profile.ps1"
mode = "copy"
variants = [
    { os = "windows", target = "~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" },
]

[dotfiles."powershell/aliases.ps1"]
source = "dotfiles/.config/powershell/aliases.ps1"
mode = "copy"
variants = [
    { os = "windows", target = "~/Documents/PowerShell/aliases.ps1" },
]

[dotfiles.yazi]
source = "dotfiles/.config/yazi"
mode = "copy"
variants = [
    { os = "linux", target = "~/.config/yazi" },
    { os = "windows", target = "~/AppData/Roaming/yazi" },
]



