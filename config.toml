# ==============================================================================
# COMMON TOOLS (mise install)
# Shared across all machines (Linux and macOS)
# ==============================================================================
[tools]
yazi = "latest"
age = "latest"
step = "latest"
restic = "latest"
jq = "latest"
yq = "latest"
croc = "latest"
bat = "latest"
