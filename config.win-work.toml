# ==============================================================================
# MISE PERSONAL PROFILE (Fedora Silverblue)
# Activated via: mise -E personal bootstrap
# Everything for the personal machine lives here.
# The assumption is that Linux is used as personal machine.
# ==============================================================================
[vars]
name = "Jiri Matejicek"
email = "jiri.matejicek@safetica.com"

# ==============================================================================
# SECRETS (mise bootstrap secrets status)
# Resolved before any other bootstrap phase.
# ==============================================================================
#[bootstrap.secrets]
#ssh_config_personal = "SSH_CONFIG_PERSONAL"


# ==============================================================================
# PERSONAL PACKAGES (mise bootstrap packages apply)
# ==============================================================================
[bootstrap.packages]
"winget:Git.Git" = "latest"
"winget:GitHub.cli" = "latest"
"winget:Microsoft.PowerShell" = "latest"
"winget:sharkdp.fd" = "latest"
"winget:junegunn.fzf" = "latest"
"winget:zyedidia.micro" = "latest"
"winget:Starship.Starship" = "latest"
"winget:ajeetdsouza.zoxide" = "latest"
"winget:eza-community.eza" = "latest"
"winget:BaileyBrown.cppcryptfs" = "1.4.4.10"
"winget:dokan-dev.Dokany" = "2.3.1.1000"

# ==============================================================================
# SYSTEM DIRECTORIES AND FILES (mise bootstrap files apply)
# ==============================================================================

# ~/.config/mise/miserc.toml (env = ["win-work"]) is written by bootstrap-win.ps1,
# [bootstrap.files] is only supported on Unix.

# [bootstrap.files."~/.ssh/config"]
# content = "{{ secret(name=\"ssh_config_personal\") }}"
# template = true
# mode = "0600"

# ==============================================================================
# PERSONAL TOOLS (mise install)
# ==============================================================================
[tools]
age-plugin-yubikey = "latest"


[tasks.bootstrap]
run_windows  = '''
powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%USERPROFILE%\.config\mise\utils\install-pwsh-modules.ps1"
ya pkg add yazi-rs/plugins:full-border
'''

