# ==============================================================================
# MISE SERVER PROFILE (Linux)
# Activated via: mise -E server bootstrap
# Everything for the server machine lives here.
# The assumption is that Linux is used as server machine.
# ==============================================================================
[vars]
name = "Jiri Matejicek"
email = "jiri.matejicek@safetica.com"

# ==============================================================================
# SECRETS (mise bootstrap secrets status)
# Resolved before any other bootstrap phase.
# ==============================================================================
# [bootstrap.secrets]
# ssh_config_work = "SSH_CONFIG_WORK"

# ==============================================================================
# SERVER PACKAGES (mise bootstrap packages apply)
# Installed via apt on Linux
# ==============================================================================
[bootstrap.packages]
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:wget" = "latest"
"apt:file" = "latest"
"apt:tree" = "latest"
"apt:zsh" = "latest"
"apt:autojump" = "latest"
"apt:tmux" = "latest"

# ==============================================================================
# SYSTEM DIRECTORIES AND FILES (mise bootstrap files apply)
# ==============================================================================

# Writes ~/.config/mise/miserc.toml, mise's global environment-selection
# file, so every future `mise` invocation loads config.personal.toml without
# needing -E personal passed explicitly. Machine-specific, gitignored.
[bootstrap.files."~/.config/mise/miserc.toml"]
content = "env = [\"server\"]\n"

# [bootstrap.files."~/.ssh/config"]
# content = "{{ secret(name=\"ssh_config_work\") }}"
# template = true
# mode = "0600"

# ==============================================================================
# WORK TOOLS (mise install)
# ==============================================================================
[tools]
micro = "latest"
starship = "latest"
gh = "latest"
fd = "latest"
eza = "latest"
fzf = "latest"
zoxide = "latest"
atuin = "latest"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"

[bootstrap.repos]
"~/.zsh/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.zsh/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }
"~/.zsh/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions.git" }
"~/.zsh/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab" }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

[bootstrap.user]
login_shell = "/bin/zsh"

[tasks.bootstrap]
run = '''
ln -sf ~/.zshrc ~/.zsh/.zshrc
touch ~/.zshrc_local
ya pkg add yazi-rs/plugins:full-border
'''